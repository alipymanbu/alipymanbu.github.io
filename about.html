  <h1 class="page-title">关于老杨</h1>
  <div class="post-body">
<p>大家好，我是老杨。</p>
<p>这些年一直泡在各类软件的第一线：安卓上的冷门工具、桌面端的专业软件、开发者向的命令行玩意儿，基本都逃不过我的折腾清单。这个博客就是我的折腾台账——每一篇都是一个我真正用过、查过资料、踩过坑的应用。</p>
<p>这里没有营销号式的功能罗列，也没有复制粘贴的官方文档。每篇文章都建立在实际体验之上：它解决什么问题、哪里好用、哪里反人类、值不值得装，我都会给出直接的答案。</p>
<p>如果你也喜欢把一个软件研究透，欢迎常来。文中提到的应用我都整理了网盘资源和相关文档站，有需要自取。</p>
